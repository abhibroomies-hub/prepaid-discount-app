api_version = "2025-07"
uid = "ae5f1096-268a-c8a0-5194-9f1adccdc72ca4e7c1ad"

[build]
command = ""

[[extensions]]
type = "order_discounts"
name = "prepaid-discount"
handle = "prepaid-discount"
description = "Dynamic prepaid discount - percentage from app metafield (namespace: prepaid_discount, key: config)"

  [[extensions.targeting]]
  module = "./src/run.js"
  target = "purchase.order-discount.run"

  [extensions.targeting.input]
  query = "./src/run.graphql"

  [extensions.targeting.output]

  # App-owned metafield for function configuration (Admin Dashboard writes via metafieldsSet)
  [[extensions.metafields]]
  namespace = "$app:prepaid_discount"
  key = "config"

